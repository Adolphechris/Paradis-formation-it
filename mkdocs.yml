site_name: PARADIS — Plateforme d'Autoformation IT
site_url: https://adolphechris.github.io/Paradis-formation-it/
repo_url: https://github.com/Adolphechris/Paradis-formation-it
repo_name: Adolphechris/Paradis-formation-it

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "black"
      accent: "blue grey"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "blue grey"
      accent: "blue grey"
  font:
    text: "Inter"
    code: "Fira Code"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - header.autohide

plugins:
  - search:
      lang: fr
      separator: '[\s\-]+'
  - tags:

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: docs
  - attr_list
  - md_in_html
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - css/style.css

extra_javascript:
  # 0. Config Google AI (Gemini) — généré par CI depuis GOOGLE_AI_API_KEY secret
  - js/ai-config.js
  # 1. Credentials Supabase — généré par CI (secrets) ou scripts/inject-config.js (local)
  #    Ce fichier définit window.__PARADIS_CONFIG__ AVANT que supabase-config.js le lise
  - js/supabase-env.js
  # 2. Lecteur de config — lit window.__PARADIS_CONFIG__ et expose window.PARADIS_SUPABASE
  - js/supabase-config.js
  # 2b. Error Boundary global — doit être chargé tôt pour couvrir tous les modules suivants
  - js/error-boundary.js
  # 3. Storage Adapter Local-First (IndexedDB)
  - js/storage-adapter.js
  # 4. Client Supabase (Auth & API)
  - js/supabase-client.js
  - js/auth-modal.js
  - js/profile-widget.js
  # 5. Modules fonctionnels (ordre : core → features)
  - js/progress-tracker.js
  - js/day-completion-widget.js
  - js/sync-bridge.js
  - js/sync-pull-engine.js
  - js/quiz-engine.js
