name: Deploy PARADIS IT — MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 : Build du site MkDocs avec injection securisee des credentials
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dependances MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Injection des credentials Supabase
        run: |
          cat > docs/js/supabase-env.js << 'ENVEOF'
          /* AUTO-GENERATED BY CI - DO NOT COMMIT */
          window.__PARADIS_CONFIG__ = {
            url: "${{ secrets.SUPABASE_URL }}",
            anonKey: "${{ secrets.SUPABASE_ANON_KEY }}",
          };
          ENVEOF
          echo "supabase-env.js injected with GitHub secrets"

      - name: Injection de la cle API Google AI (Gemini)
        run: |
          cat > docs/js/ai-config.js << 'AIEOF'
          /* AUTO-GENERATED BY CI - DO NOT COMMIT */
          window.__PARADIS_AI_CONFIG__ = {
            apiKey: "${{ secrets.GOOGLE_AI_API_KEY }}",
            model: "gemini-1.5-flash"
          };
          AIEOF
          echo "ai-config.js injected with Google AI key"

      - name: Verification aucun secret dans le code source
        run: |
          if git grep -r "supabase.co" -- '*.js' '*.yml' '*.yaml' '*.json' ':!docs/js/supabase-env.js' ':!.github/workflows/' 2>/dev/null | grep -v "example\|placeholder\|your-project\|comment\|#"; then
            echo "ATTENTION: Supabase URLs found in source code."
          else
            echo "No hardcoded secrets found."
          fi

      - name: Build MkDocs strict
        run: mkdocs build --strict

      - name: Upload artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 : Tests de validation du build
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Injection des credentials pour le build de test
        run: |
          echo 'window.__PARADIS_CONFIG__ = { url: "", anonKey: "" };' > docs/js/supabase-env.js

      - name: Build strict test
        run: mkdocs build --strict

      - name: Verification presence des 600 jours (J1-J600)
        run: |
          MISSING=0
          # Verifier un echantillon representatif de chaque semestre (J1 a J600)
          SAMPLE_DAYS="1 50 51 100 101 150 151 200 201 250 251 300 301 350 351 400 401 450 451 500 501 550 551 600"
          for i in $SAMPLE_DAYS; do
            if ! find site/ -name "index.html" -path "*/jour-${i}/*" | grep -q .; then
              echo "AVERTISSEMENT: jour-${i} absent du build (peut etre dans nav)"
              MISSING=$((MISSING + 1))
            fi
          done
          TOTAL=$(find site/ -name "index.html" -path "*/jour-*" | wc -l)
          echo "Jours presentes dans le site genere: $TOTAL"
          if [ "$TOTAL" -lt 300 ]; then
            echo "ECHEC: Moins de 300 jours generes ($TOTAL). Build incomplet."
            exit 1
          fi
          echo "OK: $TOTAL jours presentes dans le build (attendu >= 300)"

      - name: Verification index de recherche
        run: |
          if [ ! -f "site/search/search_index.json" ]; then
            echo "ERREUR: search_index.json absent"
            exit 1
          fi
          echo "Index de recherche genere"

      - name: Verification pages de tomes (S1 a S12)
        run: |
          for tome in tome-p0 tome-p2 tome-p3 tome-p4 tome-p5 tome-p6 tome-p7 tome-p8 tome-p9 tome-p10 tome-p11 tome-p12; do
            if [ ! -d "site/${tome}" ]; then
              echo "ERREUR: dossier site/${tome} absent du build"
              exit 1
            fi
          done
          echo "Tous les tomes S1-S12 sont presents dans le build"

      - name: Verification absence de secret dans le site genere
        run: |
          if grep -r "sbp_" site/js/ 2>/dev/null; then
            echo "CRITIQUE: Token Supabase trouve dans les scripts JS generes !"
            exit 1
          fi
          echo "Aucun token dans les scripts JS generes"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 : Deploiement sur GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
