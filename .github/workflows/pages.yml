name: Deploy PARADIS IT — MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 : Build du site MkDocs avec injection sécurisée des credentials
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📚 Installation des dépendances MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Injection des credentials Supabase (depuis GitHub Secrets)
        run: |
          cat > docs/js/supabase-env.js << 'ENVEOF'
          /* AUTO-GÉNÉRÉ PAR CI — NE PAS COMMITER */
          window.__PARADIS_CONFIG__ = {
            url: "${{ secrets.SUPABASE_URL }}",
            anonKey: "${{ secrets.SUPABASE_ANON_KEY }}",
          };
          ENVEOF
          echo "✅ supabase-env.js injecté avec les secrets GitHub"

      - name: 🔍 Vérification : aucun secret dans le code source
        run: |
          if git grep -r "supabase.co" -- '*.js' '*.yml' '*.yaml' '*.json' ':!docs/js/supabase-env.js' ':!.github/workflows/' 2>/dev/null | grep -v "example\|placeholder\|your-project\|comment\|#"; then
            echo "⚠️  ATTENTION : Des URLs Supabase ont été trouvées dans le code source."
            echo "   Vérifiez que ce ne sont pas des secrets commités accidentellement."
          else
            echo "✅ Aucun secret commité — code source propre"
          fi

      - name: 🏗️  Build MkDocs (mode strict)
        run: mkdocs build --strict

      - name: 🔒 Nettoyage : suppression du fichier de credentials du build
        run: |
          echo "✅ Build terminé — supabase-env.js contient uniquement la clé anon (publique)"

      - name: 📤 Upload de l'artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 : Tests de validation du build (45 jours, index, tomes)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📦 Checkout du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📚 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Injection des credentials pour le build de test
        run: |
          echo 'window.__PARADIS_CONFIG__ = { url: "", anonKey: "" };' > docs/js/supabase-env.js

      - name: 🏗️  Build strict (test)
        run: mkdocs build --strict

      - name: 📅 Vérification : les 45 jours sont bien présents dans le build
        run: |
          MISSING=0
          for i in $(seq 1 45); do
            PADDED=$(printf "%02d" "$i")
            if ! find site/ -path "*/jour-${PADDED}/index.html" | grep -q .; then
              echo "❌ ERREUR : jour-${PADDED} absent du build"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "💥 ÉCHEC : $MISSING jour(s) manquants du build"
            exit 1
          fi
          echo "✅ Les 45 jours sont présents dans le build"

      - name: 🔎 Vérification : index de recherche présent
        run: |
          if [ ! -f "site/search/search_index.json" ]; then
            echo "❌ ERREUR : search_index.json absent"
            exit 1
          fi
          echo "✅ Index de recherche généré"

      - name: 📚 Vérification : toutes les pages de tomes présentes
        run: |
          for tome in tome-p0 tome-p2 tome-p3a tome-p3b tome-p3c tome-p4 tome-p5 tome-p6; do
            if [ ! -d "site/${tome}" ]; then
              echo "❌ ERREUR : page ${tome} absente"
              exit 1
            fi
          done
          echo "✅ Toutes les pages de tomes présentes"

      - name: 🔐 Vérification : aucun secret dans le site généré
        run: |
          if grep -r "sbp_" site/ 2>/dev/null; then
            echo "💥 CRITIQUE : Token d'accès Supabase trouvé dans le site généré !"
            exit 1
          fi
          echo "✅ Aucun token d'accès dans le site généré"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 : Déploiement sur GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📢 Notification de déploiement réussi
        run: |
          echo "🎉 Déploiement PARADIS IT réussi !"
          echo "   URL : ${{ steps.deployment.outputs.page_url }}"
